site_name: SimParc-R Simulator Documentation
site_description: SimParc-R residential stock simulator applied to Madrid
site_url: https://hq-opensource.github.io/simparc-r-simulator/
repo_url: https://github.com/hq-opensource/simparc-r-simulator
repo_name: hq-opensource/simparc-r-simulator

theme:
  name: material
  logo: figures/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Madrid:
      - Summary: en/madrid-summary.md
      - Simulation Hypotheses: en/madrid-hypotheses.md
  - SimParc-R reference:
      - Overview: en/overview.md
      - Installation: en/installation.md
      - Configuration: en/configuration.md
      - Running Simulations: en/running-simulations.md
      - Results and Outputs: en/results.md
